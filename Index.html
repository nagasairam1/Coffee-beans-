  <script src="/_sdk/f344579cd2b2cf70.editing_sdk.js" integrity="sha512-bzdgmfJ/pl/acJqgk+LGvYwJbF03Y2d6f4oZHD96WjqTnvQUZBGVAQkTDRz+fyIMjVc+AXkpwFXqDYLeHDMLSw=="></script>
  <script>
    const form = document.getElementById('inquiry-form');
    const submitButton = document.getElementById('submit-button');
    const validationMessage = document.getElementById('validation-message');
    const successState = document.getElementById('success-state');
    const errorState = document.getElementById('error-state');
    let sdkReady = false;

    const dataHandler = {
      onDataChanged() {
        // This is intentionally write-only: no submitted inquiry records are rendered.
      }
    };

    async function initialiseSheet() {
      const result = await window.dataSdk.init(dataHandler);
      sdkReady = result.isOk;
      if (!result.isOk) {
        errorState.classList.remove('hidden');
      }
    }

    function showValidation(message) {
      validationMessage.textContent = message;
      validationMessage.classList.remove('hidden');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      validationMessage.classList.add('hidden');
      errorState.classList.add('hidden');

      if (!form.checkValidity()) {
        showValidation('Please complete all required fields so we can prepare the right coffee solution.');
        form.reportValidity();
        return;
      }

      if (!sdkReady) {
        errorState.classList.remove('hidden');
        return;
      }

      submitButton.disabled = true;
      submitButton.classList.add('opacity-60', 'cursor-wait');

      const formData = new FormData(form);
      const result = await window.dataSdk.create({
        contact_name: String(formData.get('contact_name')).trim(),
        company_name: String(formData.get('company_name')).trim(),
        phone_number: String(formData.get('phone_number')).trim(),
        volume_or_headcount: String(formData.get('volume_or_headcount')).trim(),
        notes: String(formData.get('notes')).trim(),
        submitted_at: new Date().toISOString()
      });

      submitButton.disabled = false;
      submitButton.classList.remove('opacity-60', 'cursor-wait');

      if (result.isOk) {
        form.classList.add('hidden');
        successState.classList.remove('hidden');
      } else {
        errorState.classList.remove('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initialiseSheet();
    });
  </script>
